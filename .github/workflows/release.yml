# Baut aus einem Versions-Tag ein GitHub Release mit Windows-Installern.
#
# Ablauf: Tag `v0.1.0` pushen -> dieser Workflow baut MSI und NSIS-Setup,
# signiert sie mit dem Update-Schlüssel, legt ein Release als Entwurf an und
# hängt Artefakte plus `latest.json` an. Das `latest.json` ist genau die Datei,
# die der Updater in der App unter
# `releases/latest/download/latest.json` abfragt.
#
# Das Release entsteht als Entwurf: erst nach dem Veröffentlichen ist es
# `releases/latest`, und erst dann sehen bestehende Installationen das Update.
# So lässt sich der Installer vorher noch selbst ausprobieren.
#
# Vorerst nur Windows — Linux/macOS ergänzen, sobald dort getestet werden kann.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # Ein Tag v0.1.1 auf einer tauri.conf.json, die noch 0.1.0 sagt, ergibt ein
      # Release mit falschem Namen: die latest.json meldet dann 0.1.0, und keine
      # Installation sieht je ein Update. Nichts daran wuerde von selbst
      # auffallen, also hier abbrechen, bevor ueberhaupt gebaut wird.
      - name: Tag und App-Version muessen uebereinstimmen
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"(.+)"' |
                    Select-Object -First 1).Matches.Groups[1].Value
          Write-Host "Tag $tag / tauri.conf.json $conf / Cargo.toml $cargo"
          if ($conf -ne $tag) {
            Write-Host "::error::Tag v$tag passt nicht zu tauri.conf.json ($conf). Version anheben, committen, Tag neu setzen."
            exit 1
          }
          if ($cargo -ne $tag) {
            Write-Host "::error::Tag v$tag passt nicht zu src-tauri/Cargo.toml ($cargo)."
            exit 1
          }

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Gesabbel ${{ github.ref_name }}
          releaseBody: |
            Windows-Installer unten unter „Assets“ — `.exe` (Setup) oder `.msi`.

            Beim ersten Start warnt Windows SmartScreen vor einem unbekannten
            Herausgeber; das Programm ist nicht signiert. Über „Weitere
            Informationen“ → „Trotzdem ausführen“ lässt sich das bestätigen.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
